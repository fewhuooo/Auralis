spring:
  config:
    activate:
      on-profile: prod
  jpa:
    open-in-view: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

auralis:
  environment: prod
  api:
    public-base-url: ${AURALIS_PUBLIC_BASE_URL}
    allowed-origins: ${AURALIS_CORS_ALLOWED_ORIGINS}
  upload:
    max-file-size-bytes: ${AURALIS_UPLOAD_MAX_FILE_SIZE_BYTES}
  ai:
    ingestion-worker-enabled: ${AURALIS_AI_INGESTION_WORKER_ENABLED:true}
