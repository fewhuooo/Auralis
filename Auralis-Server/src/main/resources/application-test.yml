spring:
  datasource:
    url: jdbc:h2:mem:auralis-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  sql:
    init:
      mode: never

server:
  port: 0

auralis:
  environment: test
  mail:
    max-sends-per-minute: 1000
  api:
    public-base-url: http://localhost
  upload:
    max-file-size-bytes: 52428800
  identity:
    jwt-secret: phase-one-test-secret-with-at-least-32-bytes
    access-token-ttl-seconds: 900
    refresh-session-ttl-seconds: 30
  ai:
    encryption-key: phase-five-test-encryption-32b!!
    ingestion-worker-enabled: false
