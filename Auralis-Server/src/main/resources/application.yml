spring:
  application:
    name: auralis-server
  profiles:
    default: local
  jpa:
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html

auralis:
  environment: local
  api:
    public-base-url: http://localhost:8080
    allowed-origins: ${AURALIS_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost}
  upload:
    max-file-size-bytes: 52428800
    storage-provider: ${AURALIS_UPLOAD_STORAGE_PROVIDER:unavailable}
    asset-retention-days: ${AURALIS_UPLOAD_ASSET_RETENTION_DAYS:30}
    asset-cleanup-delay-millis: ${AURALIS_UPLOAD_ASSET_CLEANUP_DELAY_MILLIS:3600000}
    asset-cleanup-initial-delay-millis: ${AURALIS_UPLOAD_ASSET_CLEANUP_INITIAL_DELAY_MILLIS:60000}
    storage:
      endpoint: ${AURALIS_MINIO_ENDPOINT:}
      public-endpoint: ${AURALIS_MINIO_PUBLIC_ENDPOINT:}
      bucket: ${AURALIS_MINIO_BUCKET:auralis-assets}
      access-key: ${AURALIS_MINIO_ACCESS_KEY:}
      secret-key: ${AURALIS_MINIO_SECRET_KEY:}
      presign-ttl-seconds: ${AURALIS_MINIO_PRESIGN_TTL_SECONDS:300}
  identity:
    jwt-secret: ${AURALIS_JWT_SECRET:}
    access-token-ttl-seconds: ${AURALIS_ACCESS_TOKEN_TTL_SECONDS:900}
    refresh-session-ttl-seconds: ${AURALIS_REFRESH_SESSION_TTL_SECONDS:2592000}
  ai:
    enabled: ${AURALIS_AI_ENABLED:false}
    encryption-key: ${AURALIS_AI_ENCRYPTION_KEY:}
    default-provider: ${AURALIS_AI_DEFAULT_PROVIDER:DEEPSEEK}
    defaults:
      deepseek:
        base-url: ${AURALIS_AI_DEEPSEEK_BASE_URL:https://api.deepseek.com}
        chat-model: ${AURALIS_AI_DEEPSEEK_CHAT_MODEL:deepseek-chat}
        embedding-model: ${AURALIS_AI_DEEPSEEK_EMBEDDING_MODEL:bge-m3}
        api-key: ${DEEPSEEK_API_KEY:}
      openai-compatible:
        base-url: ${AURALIS_AI_OPENAI_BASE_URL:https://api.openai.com/v1}
        chat-model: ${AURALIS_AI_OPENAI_CHAT_MODEL:gpt-4o-mini}
        embedding-model: ${AURALIS_AI_OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
        api-key: ${OPENAI_API_KEY:}
      siliconflow:
        base-url: ${AURALIS_AI_SILICONFLOW_BASE_URL:https://api.siliconflow.cn/v1}
        chat-model: ${AURALIS_AI_SILICONFLOW_CHAT_MODEL:deepseek-ai/DeepSeek-V3}
        embedding-model: ${AURALIS_AI_SILICONFLOW_EMBEDDING_MODEL:BAAI/bge-m3}
        api-key: ${SILICONFLOW_API_KEY:}
    provider-connect-timeout-millis: ${AURALIS_AI_PROVIDER_CONNECT_TIMEOUT_MILLIS:3000}
    request-timeout-millis: ${AURALIS_AI_REQUEST_TIMEOUT_MILLIS:10000}
    overview-response-timeout-millis: ${AURALIS_AI_OVERVIEW_RESPONSE_TIMEOUT_MILLIS:120000}
    overview-task-timeout-millis: ${AURALIS_AI_OVERVIEW_TASK_TIMEOUT_MILLIS:240000}
    max-prompt-chars: ${AURALIS_AI_MAX_PROMPT_CHARS:12000}
    max-retrieved-chunks: ${AURALIS_AI_MAX_RETRIEVED_CHUNKS:8}
    ingestion-max-bytes: ${AURALIS_AI_INGESTION_MAX_BYTES:5242880}
    ingestion-embedding-batch-max-items: ${AURALIS_AI_INGESTION_EMBEDDING_BATCH_MAX_ITEMS:32}
    ingestion-embedding-batch-max-utf8-bytes: ${AURALIS_AI_INGESTION_EMBEDDING_BATCH_MAX_UTF8_BYTES:32768}
    url-connect-timeout-millis: ${AURALIS_AI_URL_CONNECT_TIMEOUT_MILLIS:3000}
    url-read-timeout-millis: ${AURALIS_AI_URL_READ_TIMEOUT_MILLIS:10000}
    url-max-redirects: ${AURALIS_AI_URL_MAX_REDIRECTS:3}
    provider-max-response-bytes: ${AURALIS_AI_PROVIDER_MAX_RESPONSE_BYTES:1048576}
    allowed-provider-hosts: ${AURALIS_AI_ALLOWED_PROVIDER_HOSTS:api.deepseek.com,api.openai.com,api.siliconflow.cn}
    ingestion-worker-enabled: ${AURALIS_AI_INGESTION_WORKER_ENABLED:false}
    ingestion-poll-delay-millis: ${AURALIS_AI_INGESTION_POLL_DELAY_MILLIS:1000}
    ingestion-lease-millis: ${AURALIS_AI_INGESTION_LEASE_MILLIS:300000}
    ingestion-max-attempts: ${AURALIS_AI_INGESTION_MAX_ATTEMPTS:3}
    limits:
      global-concurrent: ${AURALIS_AI_LIMITS_GLOBAL_CONCURRENT:4}
      per-user-concurrent: ${AURALIS_AI_LIMITS_PER_USER_CONCURRENT:2}
      per-user-hourly-tokens: ${AURALIS_AI_LIMITS_PER_USER_HOURLY_TOKENS:1000000}
      per-user-daily-tokens: ${AURALIS_AI_LIMITS_PER_USER_DAILY_TOKENS:2000000}
      global-daily-tokens: ${AURALIS_AI_LIMITS_GLOBAL_DAILY_TOKENS:2000000}
      reservation-lease-millis: ${AURALIS_AI_LIMITS_RESERVATION_LEASE_MILLIS:300000}
      heartbeat-millis: ${AURALIS_AI_LIMITS_HEARTBEAT_MILLIS:10000}
      chat-max-output-tokens: ${AURALIS_AI_LIMITS_CHAT_MAX_OUTPUT_TOKENS:4096}
      chat-max-calls: ${AURALIS_AI_LIMITS_CHAT_MAX_CALLS:2}
      chat-task-tokens: ${AURALIS_AI_LIMITS_CHAT_TASK_TOKENS:32000}
      overview-max-calls: ${AURALIS_AI_LIMITS_OVERVIEW_MAX_CALLS:24}
      overview-task-tokens: ${AURALIS_AI_LIMITS_OVERVIEW_TASK_TOKENS:524288}
      ingestion-max-calls: ${AURALIS_AI_LIMITS_INGESTION_MAX_CALLS:512}
      ingestion-task-tokens: ${AURALIS_AI_LIMITS_INGESTION_TASK_TOKENS:16777216}
  sync:
    retention-cleanup-delay-millis: ${AURALIS_SYNC_RETENTION_CLEANUP_DELAY_MILLIS:3600000}
    retention-cleanup-initial-delay-millis: ${AURALIS_SYNC_RETENTION_CLEANUP_INITIAL_DELAY_MILLIS:60000}
