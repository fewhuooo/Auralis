spring:
  application:
    name: auralis-server
  profiles:
    default: local
  jpa:
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html

auralis:
  api:
    allowed-origins: ${AURALIS_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1,http://tauri.localhost}
  upload:
    max-file-size-bytes: 52428800
    storage-provider: ${AURALIS_UPLOAD_STORAGE_PROVIDER:unavailable}
    asset-retention-days: ${AURALIS_UPLOAD_ASSET_RETENTION_DAYS:30}
    asset-cleanup-delay-millis: ${AURALIS_UPLOAD_ASSET_CLEANUP_DELAY_MILLIS:3600000}
    asset-cleanup-initial-delay-millis: ${AURALIS_UPLOAD_ASSET_CLEANUP_INITIAL_DELAY_MILLIS:60000}
    storage:
      endpoint: ${AURALIS_MINIO_ENDPOINT:}
      public-endpoint: ${AURALIS_MINIO_PUBLIC_ENDPOINT:}
      bucket: ${AURALIS_MINIO_BUCKET:auralis-assets}
      access-key: ${AURALIS_MINIO_ACCESS_KEY:}
      secret-key: ${AURALIS_MINIO_SECRET_KEY:}
      presign-ttl-seconds: ${AURALIS_MINIO_PRESIGN_TTL_SECONDS:300}
  mail:
    host: ${AURALIS_MAIL_HOST:}
    port: ${AURALIS_MAIL_PORT:587}
    username: ${AURALIS_MAIL_USERNAME:}
    password: ${AURALIS_MAIL_PASSWORD:}
    from: ${AURALIS_MAIL_FROM:}
    starttls: ${AURALIS_MAIL_STARTTLS:true}
    max-sends-per-minute: ${AURALIS_MAIL_MAX_SENDS_PER_MINUTE:60}
  identity:
    jwt-secret: ${AURALIS_JWT_SECRET:}
    access-token-ttl-seconds: ${AURALIS_ACCESS_TOKEN_TTL_SECONDS:900}
    refresh-session-ttl-seconds: ${AURALIS_REFRESH_SESSION_TTL_SECONDS:2592000}
  ai:
    enabled: ${AURALIS_AI_ENABLED:false}
    thinking-enabled: ${AURALIS_AI_THINKING_ENABLED:false}
    chat-thinking-enabled: ${AURALIS_AI_CHAT_THINKING_ENABLED:true}
    overview-thinking-enabled: ${AURALIS_AI_OVERVIEW_THINKING_ENABLED:false}
    encryption-key: ${AURALIS_AI_ENCRYPTION_KEY:}
    generation:
      base-url: ${AURALIS_AI_GENERATION_BASE_URL:}
      model: ${AURALIS_AI_GENERATION_MODEL:}
      api-key: ${AURALIS_AI_GENERATION_API_KEY:}
      context-tokens: ${AURALIS_AI_GENERATION_CONTEXT_TOKENS:0}
      max-output-tokens: ${AURALIS_AI_GENERATION_MAX_OUTPUT_TOKENS:0}
    embedding:
      base-url: ${AURALIS_AI_EMBEDDING_BASE_URL:}
      model: ${AURALIS_AI_EMBEDDING_MODEL:}
      api-key: ${AURALIS_AI_EMBEDDING_API_KEY:}
    provider-connect-timeout-millis: ${AURALIS_AI_PROVIDER_CONNECT_TIMEOUT_MILLIS:3000}
    request-timeout-millis: ${AURALIS_AI_REQUEST_TIMEOUT_MILLIS:10000}
    overview-response-timeout-millis: ${AURALIS_AI_OVERVIEW_RESPONSE_TIMEOUT_MILLIS:120000}
    overview-task-timeout-millis: ${AURALIS_AI_OVERVIEW_TASK_TIMEOUT_MILLIS:240000}
    overview-model-capacities: []
    # Zero disables each extra Overview cap; model capacity and usage quotas remain enforced.
    overview-limits:
      max-prompt-chars: ${AURALIS_AI_OVERVIEW_MAX_PROMPT_CHARS:0}
      max-request-bytes: ${AURALIS_AI_OVERVIEW_MAX_REQUEST_BYTES:0}
      max-input-tokens: ${AURALIS_AI_OVERVIEW_MAX_INPUT_TOKENS:0}
      max-output-tokens: ${AURALIS_AI_OVERVIEW_MAX_OUTPUT_TOKENS:0}
      max-response-bytes: ${AURALIS_AI_OVERVIEW_MAX_RESPONSE_BYTES:0}
      max-result-chars: ${AURALIS_AI_OVERVIEW_MAX_RESULT_CHARS:0}
      max-input-snapshot-chars: ${AURALIS_AI_OVERVIEW_MAX_INPUT_SNAPSHOT_CHARS:0}
      max-source-manifest-chars: ${AURALIS_AI_OVERVIEW_MAX_SOURCE_MANIFEST_CHARS:0}
      max-sources: ${AURALIS_AI_OVERVIEW_MAX_SOURCES:0}
      max-title-chars: ${AURALIS_AI_OVERVIEW_MAX_TITLE_CHARS:0}
    max-prompt-chars: ${AURALIS_AI_MAX_PROMPT_CHARS:12000}
    ingestion-max-bytes: ${AURALIS_AI_INGESTION_MAX_BYTES:5242880}
    ingestion-embedding-batch-max-items: ${AURALIS_AI_INGESTION_EMBEDDING_BATCH_MAX_ITEMS:32}
    ingestion-embedding-batch-max-utf8-bytes: ${AURALIS_AI_INGESTION_EMBEDDING_BATCH_MAX_UTF8_BYTES:32768}
    url-connect-timeout-millis: ${AURALIS_AI_URL_CONNECT_TIMEOUT_MILLIS:3000}
    url-read-timeout-millis: ${AURALIS_AI_URL_READ_TIMEOUT_MILLIS:10000}
    url-max-redirects: ${AURALIS_AI_URL_MAX_REDIRECTS:3}
    provider-max-response-bytes: ${AURALIS_AI_PROVIDER_MAX_RESPONSE_BYTES:1048576}
    allowed-provider-hosts: ${AURALIS_AI_ALLOWED_PROVIDER_HOSTS:api.deepseek.com,api.openai.com,api.siliconflow.cn}
    ingestion-worker-enabled: ${AURALIS_AI_INGESTION_WORKER_ENABLED:false}
    ingestion-poll-delay-millis: ${AURALIS_AI_INGESTION_POLL_DELAY_MILLIS:1000}
    ingestion-lease-millis: ${AURALIS_AI_INGESTION_LEASE_MILLIS:300000}
    ingestion-max-attempts: ${AURALIS_AI_INGESTION_MAX_ATTEMPTS:3}
    shadow-token-estimate-enabled: ${AURALIS_AI_SHADOW_TOKEN_ESTIMATE_ENABLED:true}
    overview-cache-max-bytes: ${AURALIS_AI_OVERVIEW_CACHE_MAX_BYTES:268435456}
    overview-cache-max-generations: ${AURALIS_AI_OVERVIEW_CACHE_MAX_GENERATIONS:1000}
    limits:
      global-concurrent: ${AURALIS_AI_LIMITS_GLOBAL_CONCURRENT:4}
      per-user-concurrent: ${AURALIS_AI_LIMITS_PER_USER_CONCURRENT:2}
      per-user-hourly-tokens: ${AURALIS_AI_LIMITS_PER_USER_HOURLY_TOKENS:1000000}
      per-user-daily-tokens: ${AURALIS_AI_LIMITS_PER_USER_DAILY_TOKENS:2000000}
      global-daily-tokens: ${AURALIS_AI_LIMITS_GLOBAL_DAILY_TOKENS:2000000}
      reservation-lease-millis: ${AURALIS_AI_LIMITS_RESERVATION_LEASE_MILLIS:300000}
      heartbeat-millis: ${AURALIS_AI_LIMITS_HEARTBEAT_MILLIS:10000}
      chat-max-output-tokens: ${AURALIS_AI_LIMITS_CHAT_MAX_OUTPUT_TOKENS:4096}
      chat-task-tokens: ${AURALIS_AI_LIMITS_CHAT_TASK_TOKENS:655360}
      # 0 disables the separate Overview call-count cap; token quotas remain enforced.
      overview-max-calls: ${AURALIS_AI_LIMITS_OVERVIEW_MAX_CALLS:0}
      overview-task-tokens: ${AURALIS_AI_LIMITS_OVERVIEW_TASK_TOKENS:524288}
      ingestion-max-calls: ${AURALIS_AI_LIMITS_INGESTION_MAX_CALLS:512}
      ingestion-task-tokens: ${AURALIS_AI_LIMITS_INGESTION_TASK_TOKENS:16777216}
    chat-agent:
      raw-content-capture-enabled: ${AURALIS_AI_CHAT_DIAGNOSTIC_RAW_CONTENT_ENABLED:false}
      raw-content-capture-directory: ${AURALIS_AI_CHAT_DIAGNOSTIC_RAW_CONTENT_DIR:/tmp/auralis-chat-diagnostics}
      max-model-calls: ${AURALIS_AI_CHAT_AGENT_MAX_MODEL_CALLS:0}
      max-embedding-calls: ${AURALIS_AI_CHAT_AGENT_MAX_EMBEDDING_CALLS:0}
      max-iterations: ${AURALIS_AI_CHAT_AGENT_MAX_ITERATIONS:20}
      max-tool-calls: ${AURALIS_AI_CHAT_AGENT_MAX_TOOL_CALLS:40}
      max-tool-result-utf8-bytes: ${AURALIS_AI_CHAT_AGENT_MAX_TOOL_RESULT_UTF8_BYTES:65536}
      max-serialized-request-utf8-bytes: ${AURALIS_AI_CHAT_AGENT_MAX_SERIALIZED_REQUEST_UTF8_BYTES:524288}
      attempt-deadline-seconds: ${AURALIS_AI_CHAT_AGENT_ATTEMPT_DEADLINE_SECONDS:300}
  sync:
    retention-cleanup-delay-millis: ${AURALIS_SYNC_RETENTION_CLEANUP_DELAY_MILLIS:3600000}
    retention-cleanup-initial-delay-millis: ${AURALIS_SYNC_RETENTION_CLEANUP_INITIAL_DELAY_MILLIS:60000}
