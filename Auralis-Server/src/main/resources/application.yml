spring:
  application:
    name: auralis-server
  profiles:
    default: local

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html

auralis:
  environment: local
  api:
    public-base-url: http://localhost:8080
  upload:
    max-file-size-bytes: 52428800
