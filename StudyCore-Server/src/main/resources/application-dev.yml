server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/studycore
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  redis:
    host: 127.0.0.1
    port: 6379

langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.openai.com/v1
      api-key: ${AI_API_KEY:sk-real-api-key-here}
      model-name: gpt-4o-mini
      log-requests: true
      log-responses: true
    embedding-model:
      base-url: https://api.openai.com/v1
      api-key: ${AI_API_KEY:sk-real-api-key-here}
      model-name: text-embedding-3-small

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
