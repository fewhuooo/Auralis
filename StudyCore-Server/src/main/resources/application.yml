spring:
  profiles:
    active: dev
  application:
    name: studycore-server
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

# StudyCore custom configuration
studycore:
  ingest:
    max-file-size-mb: 50

langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.openai.com/v1
      api-key: ${AI_API_KEY:demo}
      model-name: gpt-4o-mini
    embedding-model:
      base-url: https://api.siliconflow.cn/v1
      api-key: ${AI_API_KEY:demo}
      model-name: BAAI/bge-m3
  milvus:
    host: localhost
    port: 19530
    collection-name: studycore_blocks

