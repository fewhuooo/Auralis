services:
  db:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    container_name: auralis-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AURALIS_DB_USER:?AURALIS_DB_USER must be set}
      POSTGRES_PASSWORD: ${AURALIS_DB_PASSWORD:?AURALIS_DB_PASSWORD must be set}
      POSTGRES_DB: ${AURALIS_DB_NAME:?AURALIS_DB_NAME must be set}
    ports:
      - "${AURALIS_DB_PORT:-5432}:5432"
    volumes:
      - auralis-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: auralis-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${AURALIS_MINIO_ROOT_USER:?AURALIS_MINIO_ROOT_USER must be set}
      MINIO_ROOT_PASSWORD: ${AURALIS_MINIO_ROOT_PASSWORD:?AURALIS_MINIO_ROOT_PASSWORD must be set}
      MINIO_API_CORS_ALLOW_ORIGIN: ${AURALIS_CORS_ALLOWED_ORIGINS:?AURALIS_CORS_ALLOWED_ORIGINS must be set}
      MINIO_HEALTHCHECK_BUCKET: ${AURALIS_MINIO_BUCKET:?AURALIS_MINIO_BUCKET must be set}
    ports:
      - "${AURALIS_MINIO_API_PORT:-9000}:9000"
      - "${AURALIS_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - auralis-minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          set -eu;
          mc alias set --quiet local http://127.0.0.1:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}";
          mc mb --ignore-existing "local/$${MINIO_HEALTHCHECK_BUCKET}";
          key=".healthcheck/$$(date +%s%N)";
          payload="auralis-minio-healthcheck";
          trap 'mc rm --force "local/$${MINIO_HEALTHCHECK_BUCKET}/$$key" >/dev/null 2>&1 || true' EXIT;
          printf '%s' "$$payload" | mc pipe "local/$${MINIO_HEALTHCHECK_BUCKET}/$$key" >/dev/null;
          mc stat "local/$${MINIO_HEALTHCHECK_BUCKET}/$$key" >/dev/null;
          test "$$(mc cat "local/$${MINIO_HEALTHCHECK_BUCKET}/$$key")" = "$$payload";
          mc rm --force "local/$${MINIO_HEALTHCHECK_BUCKET}/$$key" >/dev/null
      interval: 10s
      timeout: 15s
      retries: 3
      start_period: 15s

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: auralis-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${AURALIS_MINIO_ROOT_USER:?AURALIS_MINIO_ROOT_USER must be set}
      MINIO_ROOT_PASSWORD: ${AURALIS_MINIO_ROOT_PASSWORD:?AURALIS_MINIO_ROOT_PASSWORD must be set}
      MINIO_BUCKET: ${AURALIS_MINIO_BUCKET:?AURALIS_MINIO_BUCKET must be set}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"

  backend:
    build:
      context: ./Auralis-Server
      dockerfile: Dockerfile
    container_name: auralis-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${AURALIS_DB_NAME:?AURALIS_DB_NAME must be set}
      SPRING_DATASOURCE_USERNAME: ${AURALIS_DB_USER:?AURALIS_DB_USER must be set}
      SPRING_DATASOURCE_PASSWORD: ${AURALIS_DB_PASSWORD:?AURALIS_DB_PASSWORD must be set}
      AURALIS_PUBLIC_BASE_URL: ${AURALIS_PUBLIC_BASE_URL:?AURALIS_PUBLIC_BASE_URL must be set}
      AURALIS_UPLOAD_MAX_FILE_SIZE_BYTES: ${AURALIS_UPLOAD_MAX_FILE_SIZE_BYTES:-52428800}
      AURALIS_UPLOAD_ASSET_RETENTION_DAYS: ${AURALIS_UPLOAD_ASSET_RETENTION_DAYS:-30}
      AURALIS_UPLOAD_ASSET_CLEANUP_DELAY_MILLIS: ${AURALIS_UPLOAD_ASSET_CLEANUP_DELAY_MILLIS:-3600000}
      AURALIS_UPLOAD_ASSET_CLEANUP_INITIAL_DELAY_MILLIS: ${AURALIS_UPLOAD_ASSET_CLEANUP_INITIAL_DELAY_MILLIS:-60000}
      AURALIS_UPLOAD_STORAGE_PROVIDER: minio
      AURALIS_MINIO_ENDPOINT: http://minio:9000
      AURALIS_MINIO_PUBLIC_ENDPOINT: ${AURALIS_MINIO_PUBLIC_ENDPOINT:-http://127.0.0.1:9000}
      AURALIS_MINIO_BUCKET: ${AURALIS_MINIO_BUCKET:?AURALIS_MINIO_BUCKET must be set}
      AURALIS_MINIO_ACCESS_KEY: ${AURALIS_MINIO_ROOT_USER:?AURALIS_MINIO_ROOT_USER must be set}
      AURALIS_MINIO_SECRET_KEY: ${AURALIS_MINIO_ROOT_PASSWORD:?AURALIS_MINIO_ROOT_PASSWORD must be set}
      AURALIS_MINIO_PRESIGN_TTL_SECONDS: ${AURALIS_MINIO_PRESIGN_TTL_SECONDS:-300}
      AURALIS_JWT_SECRET: ${AURALIS_JWT_SECRET:?AURALIS_JWT_SECRET must be set}
      AURALIS_AI_ENCRYPTION_KEY: ${AURALIS_AI_ENCRYPTION_KEY:?AURALIS_AI_ENCRYPTION_KEY must be set}
      AURALIS_AI_ENABLED: ${AURALIS_AI_ENABLED:-false}
      AURALIS_AI_SHADOW_TOKEN_ESTIMATE_ENABLED: ${AURALIS_AI_SHADOW_TOKEN_ESTIMATE_ENABLED:-true}
      AURALIS_AI_OVERVIEW_INPUT_TOKEN_ESTIMATOR_MODE: ${AURALIS_AI_OVERVIEW_INPUT_TOKEN_ESTIMATOR_MODE:-legacy-bytes}
      AURALIS_AI_INGESTION_WORKER_ENABLED: ${AURALIS_AI_INGESTION_WORKER_ENABLED:-false}
      AURALIS_AI_PROVIDER_CONNECT_TIMEOUT_MILLIS: ${AURALIS_AI_PROVIDER_CONNECT_TIMEOUT_MILLIS:-3000}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      AURALIS_AI_SILICONFLOW_BASE_URL: ${AURALIS_AI_SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}
      AURALIS_AI_SILICONFLOW_CHAT_MODEL: ${AURALIS_AI_SILICONFLOW_CHAT_MODEL:-deepseek-ai/DeepSeek-V3}
      AURALIS_AI_SILICONFLOW_EMBEDDING_MODEL: ${AURALIS_AI_SILICONFLOW_EMBEDDING_MODEL:-BAAI/bge-m3}
      AURALIS_AI_REQUEST_TIMEOUT_MILLIS: ${AURALIS_AI_REQUEST_TIMEOUT_MILLIS:-10000}
      AURALIS_AI_OVERVIEW_RESPONSE_TIMEOUT_MILLIS: ${AURALIS_AI_OVERVIEW_RESPONSE_TIMEOUT_MILLIS:-120000}
      AURALIS_AI_OVERVIEW_MAX_RETRIES: ${AURALIS_AI_OVERVIEW_MAX_RETRIES:-3}
      AURALIS_AI_OVERVIEW_TASK_TIMEOUT_MILLIS: ${AURALIS_AI_OVERVIEW_TASK_TIMEOUT_MILLIS:-240000}
      AURALIS_AI_OVERVIEW_MAX_PROMPT_CHARS: ${AURALIS_AI_OVERVIEW_MAX_PROMPT_CHARS:-0}
      AURALIS_AI_OVERVIEW_MAX_REQUEST_BYTES: ${AURALIS_AI_OVERVIEW_MAX_REQUEST_BYTES:-0}
      AURALIS_AI_OVERVIEW_MAX_INPUT_TOKENS: ${AURALIS_AI_OVERVIEW_MAX_INPUT_TOKENS:-0}
      AURALIS_AI_OVERVIEW_MAX_OUTPUT_TOKENS: ${AURALIS_AI_OVERVIEW_MAX_OUTPUT_TOKENS:-0}
      AURALIS_AI_OVERVIEW_MAX_RESPONSE_BYTES: ${AURALIS_AI_OVERVIEW_MAX_RESPONSE_BYTES:-0}
      AURALIS_AI_OVERVIEW_MAX_RESULT_CHARS: ${AURALIS_AI_OVERVIEW_MAX_RESULT_CHARS:-0}
      AURALIS_AI_OVERVIEW_MAX_CHECKPOINT_CHARS: ${AURALIS_AI_OVERVIEW_MAX_CHECKPOINT_CHARS:-0}
      AURALIS_AI_OVERVIEW_MAX_PLAN_CHARS: ${AURALIS_AI_OVERVIEW_MAX_PLAN_CHARS:-0}
      AURALIS_AI_OVERVIEW_MAX_NODE_DESCRIPTOR_CHARS: ${AURALIS_AI_OVERVIEW_MAX_NODE_DESCRIPTOR_CHARS:-0}
      AURALIS_AI_OVERVIEW_MAX_CHAPTERS: ${AURALIS_AI_OVERVIEW_MAX_CHAPTERS:-0}
      AURALIS_AI_OVERVIEW_MAX_SECTIONS: ${AURALIS_AI_OVERVIEW_MAX_SECTIONS:-0}
      AURALIS_AI_OVERVIEW_MAX_PROSE_CHARS: ${AURALIS_AI_OVERVIEW_MAX_PROSE_CHARS:-0}
      AURALIS_AI_OVERVIEW_MAX_GUIDE_ITEMS: ${AURALIS_AI_OVERVIEW_MAX_GUIDE_ITEMS:-0}
      AURALIS_AI_OVERVIEW_MAX_SOURCE_IDS_PER_SECTION: ${AURALIS_AI_OVERVIEW_MAX_SOURCE_IDS_PER_SECTION:-0}
      AURALIS_AI_OVERVIEW_MAX_PROVENANCE_SECTIONS: ${AURALIS_AI_OVERVIEW_MAX_PROVENANCE_SECTIONS:-0}
      AURALIS_AI_OVERVIEW_MAX_PROVENANCE_REFS_PER_SECTION: ${AURALIS_AI_OVERVIEW_MAX_PROVENANCE_REFS_PER_SECTION:-0}
      AURALIS_AI_OVERVIEW_MAX_PROVENANCE_REFS: ${AURALIS_AI_OVERVIEW_MAX_PROVENANCE_REFS:-0}
      AURALIS_AI_OVERVIEW_MAX_PROVENANCE_LOCATIONS: ${AURALIS_AI_OVERVIEW_MAX_PROVENANCE_LOCATIONS:-0}
      AURALIS_AI_OVERVIEW_MAX_WRITER_NODES_PER_PLAN: ${AURALIS_AI_OVERVIEW_MAX_WRITER_NODES_PER_PLAN:-0}
      AURALIS_AI_OVERVIEW_MAX_INPUT_SNAPSHOT_CHARS: ${AURALIS_AI_OVERVIEW_MAX_INPUT_SNAPSHOT_CHARS:-0}
      AURALIS_AI_OVERVIEW_MAX_SOURCE_MANIFEST_CHARS: ${AURALIS_AI_OVERVIEW_MAX_SOURCE_MANIFEST_CHARS:-0}
      AURALIS_AI_OVERVIEW_MAX_JOB_REQUEST_CHARS: ${AURALIS_AI_OVERVIEW_MAX_JOB_REQUEST_CHARS:-0}
      AURALIS_AI_OVERVIEW_MAX_SOURCES: ${AURALIS_AI_OVERVIEW_MAX_SOURCES:-0}
      AURALIS_AI_OVERVIEW_MAX_TITLE_CHARS: ${AURALIS_AI_OVERVIEW_MAX_TITLE_CHARS:-0}
      AURALIS_AI_OVERVIEW_MAX_IDENTITY_CHARS: ${AURALIS_AI_OVERVIEW_MAX_IDENTITY_CHARS:-0}
      AURALIS_AI_OVERVIEW_MAX_PROVENANCE_LOCATIONS_PER_REF: ${AURALIS_AI_OVERVIEW_MAX_PROVENANCE_LOCATIONS_PER_REF:-0}
      AURALIS_AI_OVERVIEW_ADAPTIVE_GENERATION_ENABLED: ${AURALIS_AI_OVERVIEW_ADAPTIVE_GENERATION_ENABLED:-false}
      AURALIS_AI_INGESTION_EMBEDDING_BATCH_MAX_ITEMS: ${AURALIS_AI_INGESTION_EMBEDDING_BATCH_MAX_ITEMS:-32}
      AURALIS_AI_INGESTION_EMBEDDING_BATCH_MAX_UTF8_BYTES: ${AURALIS_AI_INGESTION_EMBEDDING_BATCH_MAX_UTF8_BYTES:-32768}
      AURALIS_AI_LIMITS_GLOBAL_CONCURRENT: ${AURALIS_AI_LIMITS_GLOBAL_CONCURRENT:-4}
      AURALIS_AI_LIMITS_PER_USER_CONCURRENT: ${AURALIS_AI_LIMITS_PER_USER_CONCURRENT:-2}
      AURALIS_AI_LIMITS_PER_USER_HOURLY_TOKENS: ${AURALIS_AI_LIMITS_PER_USER_HOURLY_TOKENS:-1000000}
      AURALIS_AI_LIMITS_PER_USER_DAILY_TOKENS: ${AURALIS_AI_LIMITS_PER_USER_DAILY_TOKENS:-2000000}
      AURALIS_AI_LIMITS_GLOBAL_DAILY_TOKENS: ${AURALIS_AI_LIMITS_GLOBAL_DAILY_TOKENS:-2000000}
      AURALIS_AI_LIMITS_RESERVATION_LEASE_MILLIS: ${AURALIS_AI_LIMITS_RESERVATION_LEASE_MILLIS:-300000}
      AURALIS_AI_LIMITS_HEARTBEAT_MILLIS: ${AURALIS_AI_LIMITS_HEARTBEAT_MILLIS:-10000}
      AURALIS_AI_LIMITS_CHAT_MAX_OUTPUT_TOKENS: ${AURALIS_AI_LIMITS_CHAT_MAX_OUTPUT_TOKENS:-4096}
      AURALIS_AI_LIMITS_CHAT_MAX_CALLS: ${AURALIS_AI_LIMITS_CHAT_MAX_CALLS:-2}
      AURALIS_AI_LIMITS_CHAT_TASK_TOKENS: ${AURALIS_AI_LIMITS_CHAT_TASK_TOKENS:-32000}
      AURALIS_AI_CHAT_AGENT_MAX_MODEL_CALLS: ${AURALIS_AI_CHAT_AGENT_MAX_MODEL_CALLS:-0}
      AURALIS_AI_CHAT_AGENT_MAX_EMBEDDING_CALLS: ${AURALIS_AI_CHAT_AGENT_MAX_EMBEDDING_CALLS:-0}
      AURALIS_AI_CHAT_AGENT_MAX_ITERATIONS: ${AURALIS_AI_CHAT_AGENT_MAX_ITERATIONS:-8}
      AURALIS_AI_CHAT_AGENT_MAX_TOOL_CALLS: ${AURALIS_AI_CHAT_AGENT_MAX_TOOL_CALLS:-12}
      AURALIS_AI_CHAT_AGENT_MAX_TOOL_RESULT_UTF8_BYTES: ${AURALIS_AI_CHAT_AGENT_MAX_TOOL_RESULT_UTF8_BYTES:-65536}
      AURALIS_AI_CHAT_AGENT_MAX_SERIALIZED_REQUEST_UTF8_BYTES: ${AURALIS_AI_CHAT_AGENT_MAX_SERIALIZED_REQUEST_UTF8_BYTES:-524288}
      AURALIS_AI_CHAT_AGENT_ATTEMPT_DEADLINE_SECONDS: ${AURALIS_AI_CHAT_AGENT_ATTEMPT_DEADLINE_SECONDS:-300}
      AURALIS_AI_CHAT_DIAGNOSTIC_RAW_CONTENT_ENABLED: ${AURALIS_AI_CHAT_DIAGNOSTIC_RAW_CONTENT_ENABLED:-false}
      AURALIS_AI_CHAT_DIAGNOSTIC_RAW_CONTENT_DIR: ${AURALIS_AI_CHAT_DIAGNOSTIC_RAW_CONTENT_DIR:-/tmp/auralis-chat-diagnostics}
      AURALIS_AI_LIMITS_OVERVIEW_MAX_CALLS: ${AURALIS_AI_LIMITS_OVERVIEW_MAX_CALLS:-0}
      AURALIS_AI_LIMITS_OVERVIEW_TASK_TOKENS: ${AURALIS_AI_LIMITS_OVERVIEW_TASK_TOKENS:-524288}
      AURALIS_AI_LIMITS_INGESTION_MAX_CALLS: ${AURALIS_AI_LIMITS_INGESTION_MAX_CALLS:-512}
      AURALIS_AI_LIMITS_INGESTION_TASK_TOKENS: ${AURALIS_AI_LIMITS_INGESTION_TASK_TOKENS:-16777216}
      AURALIS_AI_URL_CONNECT_TIMEOUT_MILLIS: ${AURALIS_AI_URL_CONNECT_TIMEOUT_MILLIS:-3000}
      AURALIS_AI_URL_READ_TIMEOUT_MILLIS: ${AURALIS_AI_URL_READ_TIMEOUT_MILLIS:-10000}
      AURALIS_AI_PROVIDER_MAX_RESPONSE_BYTES: ${AURALIS_AI_PROVIDER_MAX_RESPONSE_BYTES:-1048576}
      AURALIS_AI_DEFAULT_PROVIDER: ${AURALIS_AI_DEFAULT_PROVIDER:-DEEPSEEK}
      AURALIS_AI_THINKING_ENABLED: ${AURALIS_AI_THINKING_ENABLED:-false}
      AURALIS_AI_CHAT_THINKING_ENABLED: ${AURALIS_AI_CHAT_THINKING_ENABLED:-true}
      AURALIS_AI_OVERVIEW_THINKING_ENABLED: ${AURALIS_AI_OVERVIEW_THINKING_ENABLED:-false}
      AURALIS_AI_ALLOWED_PROVIDER_HOSTS: ${AURALIS_AI_ALLOWED_PROVIDER_HOSTS:-api.deepseek.com,api.openai.com,api.siliconflow.cn}
      AURALIS_CORS_ALLOWED_ORIGINS: ${AURALIS_CORS_ALLOWED_ORIGINS:?AURALIS_CORS_ALLOWED_ORIGINS must be set}
    ports:
      - "${AURALIS_SERVER_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./Auralis-PC
      dockerfile: Dockerfile
      args:
        VITE_OVERVIEW_SSE_DEADLINE_MS: ${VITE_OVERVIEW_SSE_DEADLINE_MS:-300000}
    container_name: auralis-frontend
    restart: unless-stopped
    ports:
      - "${AURALIS_FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  auralis-postgres-data:
  auralis-minio-data:

networks:
  default:
    name: auralis-network
