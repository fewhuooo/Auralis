services:
  # PostgreSQL 数据库：存储元数据
  db:
    image: postgres:15-alpine
    container_name: studycore-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: studycore
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  # Redis：处理实时同步总线
  redis:
    image: redis:7-alpine
    container_name: studycore-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data

  # pgAdmin：可选的可视化管理工具 (访问 http://localhost:5050)
  pgadmin:
    image: dpage/pgadmin4
    container_name: studycore-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@studycore.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

  # Milvus etcd
  etcd:
    container_name: studycore-milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./data/milvus/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Milvus MinIO
  minio:
    container_name: studycore-milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - ./data/milvus/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Milvus Standalone
  milvus:
    container_name: studycore-milvus
    image: milvusdb/milvus:v2.4.0
    command: ["milvus", "run", "standalone"]
    security_opt:
    - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ./data/milvus/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - "etcd"
      - "minio"

  # Backend Spring Boot Service
  backend:
    build:
      context: ./StudyCore-Server
      dockerfile: Dockerfile
    container_name: studycore-backend
    restart: always
    env_file:
      - .env
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/studycore
      - SPRING_DATA_REDIS_HOST=redis
      - LANGCHAIN4J_MILVUS_HOST=milvus
      - MINIO_ENDPOINT=http://minio:9000
    depends_on:
      - db
      - redis
      - milvus
      - minio

  # Frontend Vue + Nginx Service
  frontend:
    build:
      context: ./StudyCore-PC
      dockerfile: Dockerfile
    container_name: studycore-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

networks:
  default:
    name: studycore-network
